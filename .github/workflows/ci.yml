name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: interoff_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/interoff_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./gradlew --no-daemon test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot
        run: |
          printf 'MYSQL_ROOT_PASSWORD=ci-root\nMYSQL_PASSWORD=ci-app\n' > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf -o /dev/null localhost:8080/docs && break; sleep 5; done
      - name: Smoke
        run: |
          curl -sf localhost:8080/maps/1 > /dev/null
          route=$(curl -sf -X GET localhost:8080/maps/solve/1 -H 'Content-Type: application/json' -d '{"floor":1,"row":3,"col":5}')
          test "$route" = "RRRRR^DDL"
          curl -sf -X POST localhost:8080/packages/8710993009240 > /dev/null
          curl -sf -o /dev/null localhost:5173
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
